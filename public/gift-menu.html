<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Latte gift menu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,800;0,900;1,800&display=swap" rel="stylesheet">
<style>
  /* Rendered to a transparent PNG for a LIVE Studio Image source: keep the page background transparent. */
  html, body { margin: 0; background: transparent; }
  body { font-family: "Nunito", "Segoe UI", system-ui, sans-serif; color: #fffaf6; -webkit-font-smoothing: antialiased; }
  .panel { width: 440px; margin: 10px; padding: 22px 22px 18px; border-radius: 34px;
    background: rgba(46, 24, 32, .66); border: 2px solid rgba(255, 255, 255, .26);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22); }
  .title { font: 900 15px/1 "Nunito", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #ffc6d6; margin: 2px 6px 14px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 9px 8px; border-radius: 20px; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, .1); }
  .ico { width: 54px; height: 54px; flex: none; display: grid; place-items: center; font-size: 32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), rgba(255,255,255,.06)); border: 1.5px solid rgba(255,255,255,.22); }
  .gift { font: 900 23px/1.1 "Nunito", sans-serif; }
  .what { font: italic 800 19px/1.2 "Nunito", sans-serif; color: #ffc6d6; margin-top: 2px; }
  .big .gift { color: #ffd98a; }
  .foot { margin: 12px 6px 2px; text-align: center; font: italic 800 17px "Nunito", sans-serif; color: rgba(255, 250, 246, .8); }
</style>
</head>
<body>
  <div class="panel">
    <div class="title">Gifts make Latte…</div>
    <div class="row"><div class="ico">🌹</div><div><div class="gift">Rose</div><div class="what">sniff a rose &amp; sneeze</div></div></div>
    <div class="row"><div class="ico">🎮</div><div><div class="gift">GG</div><div class="what">do her victory pose</div></div></div>
    <div class="row"><div class="ico">😱</div><div><div class="gift">Overreact</div><div class="what">faint dramatically</div></div></div>
    <div class="row big"><div class="ico">💸</div><div><div class="gift">Money Gun</div><div class="what">go full boss mode</div></div></div>
    <div class="row big"><div class="ico">🌌</div><div><div class="gift">Galaxy</div><div class="what">see the whole universe</div></div></div>
    <div class="foot">Likes fill her love meter 💗</div>
  </div>
</body>
</html>
