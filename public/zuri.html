<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zuri LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #f7f0e4;
    --muted: rgba(247,240,228,.72);
    --gold: #d9b46f;
    --gold-soft: rgba(217,180,111,.5);
    --gold-faint: rgba(217,180,111,.22);
    --foil: linear-gradient(100deg, #9c7535 0%, #e9cc8c 18%, #fff4d6 30%, #d8b06a 46%, #a27a3a 62%, #f1d79f 80%, #b48a45 100%);
    --onyx: rgba(14,10,8,.6);
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Jost", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; font-variant-numeric: lining-nums; }
  #stage { position: absolute; width: 1080px; height: 1920px; left: 50%; top: 50%; transform-origin: center; overflow: hidden; background: #120d0a; }

  /* Two players take turns; every clip starts on the same anchor frame, so swaps are invisible. */
  /* Hard cuts only: every clip starts and ends on the same frame, so a crossfade would just double-expose
     two slightly different frames (and the poster behind them) for a moment, which reads as a ghost. */
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; visibility: hidden; }
  video.front { visibility: visible; z-index: 2; }
  video.back { z-index: 1; }
  #poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }

  .ui { position: absolute; z-index: 5; }
  .caps { font: 500 19px/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
  .foil { background: var(--foil); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sheen 9s ease-in-out infinite; }
  @keyframes sheen { 0%, 100% { background-position: 0% 0 } 50% { background-position: 100% 0 } }
  .lift { filter: drop-shadow(0 2px 10px rgba(0,0,0,.65)); }
  .shade { text-shadow: 0 2px 14px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.6); }
  .gem { display: inline-block; width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold); box-shadow: 0 0 8px rgba(217,180,111,.8); flex: none; }

  /* Smoked-glass card with a double gold hairline and Art Deco corner brackets. */
  .frame { background: var(--onyx); border: 1px solid var(--gold-soft);
    backdrop-filter: blur(16px) saturate(120%); -webkit-backdrop-filter: blur(16px) saturate(120%);
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,240,210,.08); }
  .frame::before { content: ''; position: absolute; inset: 5px; border: 1px solid var(--gold-faint); pointer-events: none; }
  .frame::after { content: ''; position: absolute; inset: -1px; pointer-events: none; --c: var(--gold); --l: 18px; --w: 2px;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--w) var(--l) no-repeat; }

  /* Right column, text only, over the dark top of the window so the rain still shows through. */
  #crest { right: 40px; top: 214px; width: 420px; text-align: right; }
  #crest .f1 { font: 500 30px/1 var(--sans); letter-spacing: .12em; color: var(--gold); margin-left: 14px; padding: 6px 8px 5px 10px; border: 1px solid var(--gold-soft); vertical-align: 18px; }
  #crest::before { content: ''; position: absolute; inset: -40px -44px -40px -70px; z-index: -1;
    background: radial-gradient(ellipse at 75% 50%, rgba(6,4,3,.55), rgba(6,4,3,0) 70%); }
  #crest .name { font: italic 600 80px/1 var(--serif); letter-spacing: .005em; margin-top: 8px; padding-right: 6px; white-space: nowrap; }
  .rule { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin: 8px 0 12px auto; width: 300px; }
  .rule::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule::after { content: ''; width: 34px; height: 1px; background: var(--gold); }
  #crest .sub { font: 400 21px/1.35 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

  #mood { right: 40px; top: 432px; width: 420px; text-align: right; }
  #mood .state { font: italic 500 64px/1 var(--serif); margin-top: 8px; color: var(--ivory); }
  #mood.change .state { animation: glow 1.4s ease; }
  .meter { display: flex; align-items: center; gap: 12px; margin-top: 14px; justify-content: flex-end; }
  .meter .lbl { font: 500 17px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  .track { position: relative; width: 170px; height: 3px; background: rgba(217,180,111,.25); }
  .track i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--foil); transition: width .8s ease; }
  .track i::after { content: ''; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; transform: rotate(45deg);
    background: #fff1cf; box-shadow: 0 0 10px rgba(255,220,150,.95); }
  .meter .num { font: 600 24px var(--sans); color: var(--gold); min-width: 62px; text-align: right; letter-spacing: .05em; }

  #fav { right: 40px; top: 600px; width: 420px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  #fav .txt { text-align: right; min-width: 0; }
  #fav .n { font: 600 42px/1.05 var(--serif); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
  .av { width: 78px; height: 78px; flex: none; border-radius: 50%; padding: 2px; background: conic-gradient(from 200deg, #8f6a2f, #fff1cf, #c79b52, #8f6a2f, #f0d496, #8f6a2f); box-shadow: 0 0 16px rgba(217,180,111,.35); }
  .av i { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #120d0a; background: #2a1f17 center/cover;
    font: 600 34px var(--serif); color: var(--gold); }
  #fav.steal { animation: glow 1.4s ease; }

  /* Left: the gift card, on the plain cabinet drawers, between the HomeView and the bed.
     Fixed rows (head, gift, dots, footer) so nothing can overlap; long gift names shrink to fit. */
  #menu { left: 30px; top: 988px; width: 340px; padding: 16px 22px 14px; text-align: center;
    background: rgba(14,10,8,.74); backdrop-filter: none; -webkit-backdrop-filter: none;
    transition: opacity .8s ease, transform .8s ease, box-shadow .8s ease; opacity: .9; }
  #menu .head { display: flex; align-items: center; gap: 12px; justify-content: center; height: 20px; }
  #feat { position: relative; height: 156px; margin-top: 10px; }
  .gift { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    opacity: 0; transform: translateY(8px); transition: opacity .6s ease, transform .6s ease; }
  .gift.on { opacity: 1; transform: none; }
  .gift .ic { width: 56px; height: 56px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
    border: 1px solid var(--gold-soft); box-shadow: inset 0 0 0 4px rgba(14,10,8,.6), inset 0 0 0 5px var(--gold-faint); background: rgba(217,180,111,.08); }
  .gift .g { font: italic 600 36px/1.05 var(--serif); color: var(--ivory); white-space: nowrap; margin-top: 10px; max-width: 100%; }
  .gift .a { font: 400 19px/1.3 var(--sans); color: var(--muted); margin-top: 8px; max-width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gift.hit .ic { animation: glow 1.4s ease; }
  #dots { display: flex; justify-content: center; gap: 10px; height: 10px; margin-top: 4px; }
  #dots i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--gold-soft); transition: background .4s; }
  #dots i.on { background: var(--gold); box-shadow: 0 0 8px rgba(217,180,111,.8); }
  #menu .cta { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--gold-faint); font: italic 500 24px/1.2 var(--serif); color: var(--ivory); }
  #menu .cta span { color: var(--gold); }
  #menu .cta { white-space: nowrap; overflow: hidden; transition: opacity .6s ease; }
  #menu .cta.fade { opacity: 0; }
  /* While reactions play, the card steps back; when nobody is interacting (or she sleeps) it steps forward. */
  .busy #menu { opacity: .42; transform: scale(.97); }
  .quiet #menu { opacity: 1; animation: invite 3.2s ease-in-out infinite; }
  @keyframes invite { 50% { box-shadow: 0 0 34px rgba(217,180,111,.35), 0 18px 40px rgba(0,0,0,.45); } }

  /* Center, transient: gift callout, captions, toasts, sparkles. */
  #callout { left: 50%; top: 700px; display: flex; align-items: center; gap: 16px; padding: 16px 40px 16px 16px; white-space: nowrap; max-width: 1000px;
    transform: translate(-50%, 16px); opacity: 0; transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  #callout.on { opacity: 1; transform: translate(-50%, 0); }
  #callout .who { font: 600 46px/1.05 var(--serif); max-width: 760px; overflow: hidden; text-overflow: ellipsis; }
  #callout .what { font: italic 500 34px/1.2 var(--serif); color: var(--gold); margin-top: 2px; }
  #callout.big { border-color: rgba(255,226,160,.95); box-shadow: 0 0 60px rgba(230,180,90,.45), 0 18px 40px rgba(0,0,0,.45); }
  #callout.big .who { background: var(--foil); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 3s ease-in-out infinite; }
  #flash { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(255,214,140,0) 35%, rgba(255,200,110,.35) 100%); }
  #flash.on { animation: flash 2.4s ease; }
  @keyframes flash { 0% { opacity: 0 } 20% { opacity: 1 } 100% { opacity: 0 } }

  #caption { left: 50%; top: 936px; width: 1000px; white-space: nowrap; text-align: center; font: italic 500 50px/1.15 var(--serif); color: var(--ivory);
    transform: translate(-50%, 10px); opacity: 0; transition: opacity 1s ease, transform 1s ease; }
  #caption.on { opacity: 1; transform: translate(-50%, 0); }
  /* the mood caption steps aside while a gift alert or welcome is on screen */
  .talking #caption { opacity: 0; }

  #toast { left: 50%; top: 836px; display: flex; align-items: center; gap: 12px; padding: 14px 30px; white-space: nowrap; max-width: 980px; overflow: hidden;
    font: 500 25px var(--sans); letter-spacing: .06em; transform: translate(-50%, 10px); opacity: 0; transition: all .45s ease; }
  #toast b { font: italic 600 34px var(--serif); letter-spacing: 0; color: var(--gold); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  .spark { position: absolute; z-index: 4; pointer-events: none; color: #ffe7b0; text-shadow: 0 0 10px rgba(255,210,130,.95), 0 0 22px rgba(217,180,111,.6);
    animation: rise 2.6s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.4) rotate(0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-360px) scale(1.1) rotate(90deg); opacity: 0 } }
  @keyframes glow { 30% { filter: drop-shadow(0 0 14px rgba(255,214,140,.9)) } }

  #status { left: 12px; bottom: 6px; font: 500 14px var(--sans); opacity: .5; display: none; }
  .debug #status { display: block; }
</style>
</head>
<body>
<div id="stage">
  <img id="poster" alt="">
  <video id="vA" class="front" playsinline preload="auto"></video>
  <video id="vB" class="back" playsinline preload="auto"></video>
  <div id="flash"></div>

  <div id="crest" class="ui">
    <div class="caps shade">The private suite</div>
    <div class="name"><span class="foil lift">Savannah</span><span class="f1">F1</span></div>
    <div class="rule"></div>
    <div class="sub shade">The rarest cat on LIVE</div>
  </div>
  <div id="mood" class="ui">
    <div class="caps shade">Her Highness is</div>
    <div class="state shade" id="moodLabel">Content</div>
    <div class="meter"><span class="lbl shade">Affection</span><div class="track"><i id="loveBar"></i></div><span class="num shade" id="loveNum">0%</span></div>
  </div>
  <div id="fav" class="ui"><div class="txt"><div class="caps shade">Her favorite human</div><div class="n shade" id="favName">could be you</div></div><div class="av"><i id="favPic">♛</i></div></div>

  <div id="menu" class="ui frame">
    <div class="head"><span class="gem"></span><span class="caps" id="menuHead">Spoil her</span><span class="gem"></span></div>
    <div id="feat"></div>
    <div id="dots"></div>
    <div class="cta" id="cta">Tap <span>♥</span> for a slow blink</div>
  </div>

  <div id="callout" class="ui frame"><div class="av"><i id="cPic"></i></div><div><div class="who" id="cWho"></div><div class="what" id="cWhat"></div></div></div>
  <div id="toast" class="ui frame"></div>
  <div id="status" class="ui"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const R = Math.random;
const stage = $('stage');
const params = new URLSearchParams(location.search);
if (params.has('debug')) document.body.classList.add('debug');
// ?monitor=1: the Control Room's preview. It mirrors what the real overlay (LIVE Studio) is playing, silently,
// and never drives clips, sound or saved state itself.
const MONITOR = params.has('monitor');
const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
addEventListener('resize', fit); fit();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let cfg; const available = new Set();
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('zuri_' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('zuri_' + k, JSON.stringify(v)); } catch {} },
};
let state = Object.assign({ love: 0, fans: {}, likesBank: 0 }, store.get('state', {}));
const save = () => {
  if (MONITOR) return;
  // Keep the saved fan list small on long-running streams: the top 300 gifters are plenty.
  const fans = Object.entries(state.fans);
  if (fans.length > 300) state.fans = Object.fromEntries(fans.sort((a, b) => b[1].coins - a[1].coins).slice(0, 300));
  store.set('state', state);
};
// The version stamp makes each overlay load fetch fresh clip files (rebuilt clips are never served stale).
const bootStamp = Date.now().toString(36);
const url = (name) => cfg.clipUrl.replace('{name}', name) + '?v=' + bootStamp;

// ---------- sound: each clip carries its own rain and cat sounds; the lo-fi bed plays underneath ----------
let music = null, audioOk = null, clipsMuted = false;
const soundUrl = (name) => `/${cfg.audio.dir}/${name}.mp3`;
function fadeTo(el, target, ms = 1500) {
  if (!el) return;
  const start = el.volume, t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / ms); el.volume = start + (target - start) * k; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setAudioOk(ok) { if (audioOk !== ok) { audioOk = ok; report({ type: 'audio', ok }); } }
async function startMusic() {
  if (!music) return;
  try { await music.play(); setAudioOk(!clipsMuted); } catch { setAudioOk(false); }
}
async function setupAudio() {
  if (await headOk(soundUrl(cfg.audio.music))) {
    music = new Audio(soundUrl(cfg.audio.music)); music.loop = true; music.volume = cfg.audio.musicVolume; music.preload = 'auto';
  }
  await startMusic();
  // If the host blocked autoplay, keep retrying quietly (LIVE Studio normally allows it).
  setInterval(() => {
    if (audioOk) return;
    startMusic();
    if (clipsMuted) { cur.muted = false; cur.play().then(() => { clipsMuted = false; nxt.muted = false; setAudioOk(true); }).catch(() => { cur.muted = true; cur.play().catch(() => {}); }); }
  }, 5000);
}
// Play a clip with its sound; if the browser refuses sound, fall back to muted so the picture never stops.
async function playVideo(v) {
  v.volume = cfg.audio.clipVolume; v.muted = clipsMuted || MONITOR;
  try { await v.play(); }
  catch { if (!v.muted) { clipsMuted = true; v.muted = true; setAudioOk(false); await v.play().catch(() => {}); } }
}

// ---------- mood: gifts make her delighted; with no gifts she drifts content -> bored -> drowsy -> ignored ----------
let lastGiftAt = 0;
const likeTimes = [], chatTimes = [];
let mood = 'content';

function computeMood() {
  const now = Date.now(), ex = cfg.excitement;
  const recent = (arr, s) => { while (arr.length && now - arr[0].t > s * 1000) arr.shift(); return arr.reduce((t, x) => t + x.n, 0); };
  if (now - lastGiftAt < ex.giftSeconds * 1000 ||
      recent(likeTimes, ex.likesWindowSeconds) >= ex.likesToExcite ||
      recent(chatTimes, ex.likesWindowSeconds) >= ex.chatsToExcite) return 'excited';
  const since = (now - lastGiftAt) / 1000;
  const drift = Object.entries(cfg.moods).filter(([, m]) => m.afterSeconds && since >= m.afterSeconds)
    .sort((a, b) => b[1].afterSeconds - a[1].afterSeconds)[0];
  return drift ? drift[0] : 'content';
}

// The gift card's footer: the mood line when there is one (asleep, bored…), otherwise the like hint.
// It lives inside the card so it can never collide with anything else on screen.
function setFooter(caption) {
  const el = $('cta'), html = caption ? esc(caption) : 'Tap <span>♥</span> for a slow blink';
  if (el.dataset.html === html) return;
  el.dataset.html = html; el.classList.add('fade');
  setTimeout(() => {
    el.innerHTML = html; el.style.fontSize = '';
    let size = 24; while (el.scrollWidth > el.clientWidth && size > 17) el.style.fontSize = (size -= 1) + 'px';
    el.classList.remove('fade');
  }, 600);
}
// What the mood pill shows: the leave-on mode (Asleep / Playing) wins over the mood.
let shown = null;
function refreshMood() {
  mood = computeMood();
  const key = mode ? 'mode:' + mode : mood;
  if (key === shown) return;
  shown = key;
  const m = mode ? cfg.modes[mode] : cfg.moods[mood];
  const quiet = mode ? !!m.quietMusic : cfg.audio.quietMoods.includes(mood);
  $('moodLabel').textContent = m.label;
  $('mood').classList.remove('change'); void $('mood').offsetWidth; $('mood').classList.add('change');
  setFooter(m.caption);
  report({ type: 'mood', name: key });
  if (music) fadeTo(music, quiet ? cfg.audio.quietMusicVolume : cfg.audio.musicVolume, 3000);
}
setInterval(() => { if (cfg && !MONITOR) { refreshMood(); reportState(); } }, 1000);
// Everything the Control Room shows about the stream, sent once a second.
function reportState() {
  const m = mode ? cfg.modes[mode] : cfg.moods[mood];
  const top = Object.values(state.fans).sort((a, b) => b.coins - a.coins)[0];
  // Countdown for everything waiting: the rest of the current clip (plus her wake-up if asleep), then each clip in order.
  sortQueue();
  let t = Math.max(0, (cur.duration || 0) - cur.currentTime) + (mode && actionQ.length ? clipLen(cfg.modes[mode].exit) : 0);
  const queue = actionQ.map((a) => { const eta = t; t += clipLen(a.clip); return { clip: a.clip, kind: a.kind, gift: a.gift?.gift, icon: a.gift?.icon,
    who: a.who, count: a.count, value: Math.round(a.value), merged: a.merged || 0, eta: Math.round(eta) }; });
  const now = curJob ? { kind: curJob.kind, gift: curJob.gift?.gift, icon: curJob.gift?.icon, who: curJob.who, count: curJob.count } : null;
  const idleFor = (Date.now() - lastActivityAt) / 1000;
  stage.classList.toggle('busy', !!curJob || actionQ.length > 0);
  stage.classList.toggle('quiet', !curJob && !actionQ.length && (mode === 'sleep' || idleFor > (cfg.queue?.quietAfterSeconds ?? 30)));
  stage.classList.toggle('talking', calling || toasting);
  $('menuHead').textContent = mode === 'sleep' ? 'Wake her up' : 'Spoil her';
  report({ type: 'state', clip: playing(cur), at: cur.currentTime, dur: cur.duration || 0, next: nxtPlan?.clip, now,
    queue, mood, mode, label: m?.label, caption: m?.caption || '',
    love: Math.min(100, Math.round(state.love / cfg.moodGoal * 100)), fav: top ? { name: top.name, pic: top.pic } : null,
    idleFor: Math.max(0, Math.round((Date.now() - lastActivityAt) / 1000)), sleepAfter: cfg.modes?.sleep?.afterSeconds,
    nextSurpriseIn: nextSurpriseAt ? Math.max(0, Math.round((nextSurpriseAt - Date.now()) / 1000)) : null,
    audio: audioOk, clipsMuted, available: [...available], w: innerWidth, h: innerHeight });
}

// ---------- surprises ----------
// Now and then, while she's awake and nothing is queued, she does one of her special moments on her own
// (mirror, window, very rarely the nine tails). Labeled as her own whim, never as a fake viewer's gift.
// Surprises don't count as viewer activity, so they never keep her awake or wake her up.
let nextSurpriseAt = 0; const surpriseLast = store.get('surpriseLast', {});
function scheduleSurprise() {
  const sp = cfg.surprises; if (!sp?.enabled) { nextSurpriseAt = 0; return; }
  const [a, b] = sp.everyMinutes; nextSurpriseAt = Date.now() + (a + R() * (b - a)) * 60000;
}
function fireSurprise(forced = false) {
  const sp = cfg.surprises; if (!sp || (!forced && (!sp.enabled || mode || actionQ.length || swapping))) return false;
  if (!forced && Date.now() - lastGiftAt < (sp.quietAfterGiftSeconds || 0) * 1000) return false;
  const pool = Object.entries(sp.pool).filter(([clip, x]) => x.weight > 0 && available.has(clip) &&
    Date.now() - (surpriseLast[clip] || 0) >= (x.cooldownMinutes || 0) * 60000);
  if (!pool.length) return false;
  let r = R() * pool.reduce((t, [, x]) => t + x.weight, 0), pick = pool[0];
  for (const it of pool) { if ((r -= it[1].weight) < 0) { pick = it; break; } }
  const [clip, x] = pick;
  surpriseLast[clip] = Date.now(); if (!MONITOR) store.set('surpriseLast', surpriseLast);
  react(clip, { surprise: true, onStart: () => callout({ who: sp.title || '✦ Zuri’s whim', what: x.line, big: !!x.big }) });
  return true;
}
setInterval(() => {
  if (!cfg || MONITOR || !nextSurpriseAt || Date.now() < nextSurpriseAt) return;
  if (fireSurprise()) scheduleSurprise(); else nextSurpriseAt = Date.now() + 30000;   // busy or asleep: try again later
}, 2000);

// ---------- seamless clip player ----------
let cur = $('vA'), nxt = $('vB');
let nxtPlan = null;
const actionQ = [];
let lastMoment = null, repeatCount = 0;

function pickMoment() {
  const weights = cfg.moods[mood]?.weights || {};
  const pool = Object.entries(cfg.moments).map(([name, m]) => [name, m, weights[name] ?? m.weight])
    .filter(([name, m, w]) => w > 0 && available.has(name) && (name !== lastMoment || (m.repeat && repeatCount < (cfg.maxRepeatInARow || 2))));
  const total = pool.reduce((t, [, , w]) => t + w, 0);
  let r = R() * total;
  for (const [name, , w] of pool) { if ((r -= w) < 0) return name; }
  return [...available].find((n) => cfg.moments[n] && n !== lastMoment) || lastMoment;
}

// ---------- leave-on modes (play, sleep) ----------
// With nobody interacting she drifts into a mode: its enter clip takes her from the anchor into the pose,
// the loop clip repeats forever, and the exit clip brings her back to the anchor before any reaction plays.
let mode = null;                 // the mode she is in right now (set when its enter clip starts)
let lastActivityAt = Date.now();
const modeReady = (m) => m && [m.enter, m.loop, m.exit].every((c) => available.has(c));
function desiredMode() {
  const since = (Date.now() - lastActivityAt) / 1000;
  const due = Object.entries(cfg.modes || {}).filter(([, m]) => modeReady(m) && since >= m.afterSeconds)
    .sort((a, b) => b[1].afterSeconds - a[1].afterSeconds)[0];
  return due ? due[0] : null;
}
function wakeUp() {
  lastActivityAt = Date.now();
  // A calm loop (sleep) can be cut at any moment, so the exit starts right away instead of after the loop.
  const m = mode && cfg.modes[mode];
  if (m && m.interruptible && cur.dataset.clip === m.loop && !swapping) { prepare(); swap(); }
  else replan();
}

function planNext() {
  if (mode && (actionQ.length || desiredMode() !== mode)) return { clip: cfg.modes[mode].exit, setMode: null };
  if (mode) return { clip: cfg.modes[mode].loop };
  if (actionQ.length) { sortQueue(); return { clip: actionQ[0].clip, job: actionQ[0] }; }
  const want = desiredMode();
  if (want) return { clip: cfg.modes[want].enter, setMode: want };
  return { clip: pickMoment() };
}

// A clip can have several takes (zuri.json → variants); one is picked at random each time it plays.
function variantOf(clip) {
  const takes = (cfg.variants?.[clip] || []).filter((v) => available.has(v));
  return takes.length ? takes[Math.floor(R() * takes.length)] : clip;
}
const playing = (v) => v.dataset.file || v.dataset.clip;

function prepare() {
  nxtPlan = planNext();
  if (nxt.dataset.clip !== nxtPlan.clip) {
    nxt.dataset.clip = nxtPlan.clip;
    nxt.dataset.file = variantOf(nxtPlan.clip);
    nxt.src = url(nxt.dataset.file);
    nxt.load();
  }
  nxt.currentTime = 0;
}

function replan() {
  const left = (cur.duration || 0) - (cur.currentTime || 0);
  if (left > 0.6) prepare();
}

let swapping = false, curJob = null;
// Resolves once the video has actually drawn a frame, so the cut never shows an empty player.
const painted = (v) => new Promise((r) => {
  const t = setTimeout(r, 250);
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => { clearTimeout(t); r(); }); else { clearTimeout(t); setTimeout(r, 40); }
});
async function swap() {
  if (swapping) return;
  swapping = true;
  const plan = nxtPlan;
  if (nxt.readyState < 2) await new Promise((r) => nxt.addEventListener('canplay', r, { once: true }));
  await playVideo(nxt);
  await painted(nxt);
  nxt.className = 'front'; cur.className = 'back';
  $('poster').style.visibility = 'hidden';   // only needed before the very first clip
  cur.pause();
  [cur, nxt] = [nxt, cur];
  report({ type: 'clip', name: playing(cur), queued: actionQ.length, mood: mode ? mode + ' mode' : mood });
  curJob = plan.job || null;
  // A gift reaction counts as activity until it ends, so she stays awake a while after the last gift plays.
  if (curJob?.kind === 'gift') lastActivityAt = Math.max(lastActivityAt, Date.now() + clipLen(plan.clip) * 1000);
  if (plan.job) { const i = actionQ.indexOf(plan.job); if (i >= 0) actionQ.splice(i, 1); if (plan.job.onStart) plan.job.onStart(); }
  stage.classList.toggle('busy', !!curJob || actionQ.length > 0);
  if (cfg.moments[plan.clip]) { repeatCount = plan.clip === lastMoment ? repeatCount + 1 : 1; lastMoment = plan.clip; }
  if ('setMode' in plan) { mode = plan.setMode; refreshMood(); }
  swapping = false;
  prepare();
}

// Watchdog: a live stream must never freeze. Resume a paused clip; skip past a missed "ended" event.
let lastT = -1, stuckFor = 0;
setInterval(() => {
  if (document.hidden || !cur.src) return;
  if (cur.paused && !cur.ended) playVideo(cur);
  stuckFor = cur.currentTime === lastT ? stuckFor + 1 : 0;
  lastT = cur.currentTime;
  if (stuckFor >= 3 && cur.duration && cur.duration - cur.currentTime < 0.5) { stuckFor = 0; swap(); }
}, 500);

function startPlayer() {
  for (const v of [$('vA'), $('vB')]) v.addEventListener('ended', () => { if (v === cur) swap(); });
  // A clip that fails to load is dropped for this session and replaced, so the stream never stops.
  for (const v of [$('vA'), $('vB')]) v.addEventListener('error', () => {
    const bad = playing(v); if (!bad) return;
    available.delete(bad); report({ type: 'error', text: `clip "${bad}" failed to load, skipped` });
    actionQ.forEach((a) => { if (a.clip === bad) a.clip = cfg.fallbackClip; });
    v.dataset.clip = '';
    if (v === nxt) prepare(); else { prepare(); swap(); }
  });
  const first = pickMoment();
  lastMoment = first; repeatCount = 1;
  cur.dataset.clip = first; cur.dataset.file = variantOf(first); cur.src = url(cur.dataset.file);
  playVideo(cur);
  report({ type: 'clip', name: playing(cur), mood });
  prepare();
}

// ---------- the queue ----------
// Gifts play by value: costlier gifts first, and a cheap gift gains a little priority every second it waits,
// so it is never stuck forever. The same clip already waiting is merged ("maria & 3 others ×5") instead of
// playing again. Free reactions (looks, blinks, surprises) have no value and always wait behind gifts.
const priority = (it) => it.value > 0 ? it.value + (Date.now() - it.at) / 1000 * (cfg.queue?.ageBonusPerSecond ?? 0.5) : -1 - (Date.now() - it.at) / 1e9;
const sortQueue = () => actionQ.sort((a, b) => priority(b) - priority(a));
function queueChanged() {
  sortQueue();
  if (mode) return wakeUp();
  if (nxtPlan && actionQ.length && actionQ[0] !== nxtPlan.job) replan();
}
function queueGift(gift, ev, n, coins) {
  if (MONITOR) return;
  const who = ev.user.name, clip = available.has(gift.clip) ? gift.clip : cfg.fallbackClip;
  const same = actionQ.find((x) => x.kind === 'gift' && x.clip === clip && x.gift === gift);
  if (same) {
    if (!same.who.includes(who)) same.who.push(who);
    same.count += n; same.value += coins; same.merged = (same.merged || 0) + 1;
  } else {
    actionQ.push({ kind: 'gift', clip, gift, who: [who], pic: ev.user.pic, count: n, value: coins, big: !!gift.big, at: Date.now(),
      onStart() { callout({ who: this.who.length > 1 ? `${this.who[0]} & ${this.who.length - 1} other${this.who.length > 2 ? 's' : ''}` : this.who[0],
        what: `${gift.line}${this.count > 1 ? ' ×' + this.count : ''}`, pic: this.pic, big: this.big }); } });
  }
  // Too many waiting: the cheapest pending gifts are thanked on screen instead of each playing.
  sortQueue();
  const gifts = actionQ.filter((x) => x.kind === 'gift' && x !== nxtPlan?.job);
  for (const drop of gifts.slice(cfg.queue?.maxPendingGifts ?? 6).filter((x) => !x.big)) {
    actionQ.splice(actionQ.indexOf(drop), 1);
    toast(`<b>${esc(drop.who.join(', '))}</b> thank you for the ${esc(drop.gift.gift)}${drop.count > 1 ? ' ×' + drop.count : ''} ♥`);
  }
  // free reactions waiting behind gifts are dropped; she has better things to do
  for (let i = actionQ.length - 1; i >= 0; i--) if (actionQ[i].kind !== 'gift' && actionQ[i].kind !== 'force' && actionQ[i] !== nxtPlan?.job) actionQ.splice(i, 1);
  queueChanged();
}

// Queue a free reaction (look, blink, milestone, surprise, Control Room). Skipped if the same clip already waits.
function react(clip, job = {}) {
  if (MONITOR) { if (job.onStart) job.onStart(); return; }
  const c = available.has(clip) ? clip : cfg.fallbackClip;
  if (actionQ.some((x) => x.clip === c && x.kind !== 'gift')) return;
  const item = { kind: job.kind || (job.surprise ? 'surprise' : 'free'), value: 0, at: Date.now(), ...job, clip: c };
  actionQ.push(item);
  sortQueue();
  if (mode) { if (!job.surprise) wakeUp(); }
  else if (actionQ[0] === item) replan();
}

// ---------- UI ----------
function avatar(el, name, pic) { el.style.backgroundImage = pic ? `url("${pic}")` : ''; el.textContent = pic ? '' : (String(name || '?').trim()[0] || '?').toUpperCase(); }
const callQ = []; let calling = false;
function callout(c) { callQ.push(c); if (!calling) nextCall(); }
async function nextCall() {
  const c = callQ.shift(); if (!c) { calling = false; return; }
  calling = true;
  $('cWho').textContent = c.who; $('cWhat').textContent = c.what; avatar($('cPic'), c.who, c.pic);
  $('callout').className = 'ui frame on' + (c.big ? ' big' : '');
  if (c.big) { $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on'); }
  await sleep(callQ.length > 2 ? 1800 : 3400);
  $('callout').className = 'ui frame' + (c.big ? ' big' : '');
  await sleep(500); nextCall();
}
// Toasts queue up and the oldest is dropped when a crowd arrives, so they never stack.
const toastQ = []; let toasting = false;
function toast(html) { if (toastQ.length > 3) toastQ.shift(); toastQ.push(html); if (!toasting) nextToast(); }
async function nextToast() {
  const t = toastQ.shift(); if (!t) { toasting = false; return; }
  toasting = true;
  $('toast').innerHTML = t; $('toast').classList.add('on');
  await sleep(2600); $('toast').classList.remove('on'); await sleep(500); nextToast();
}
function sparkle(n = 4) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    const s = document.createElement('div'); s.className = 'spark'; s.textContent = R() < 0.7 ? '✦' : '✧';
    s.style.fontSize = (22 + R() * 26) + 'px';
    s.style.left = (400 + R() * 280) + 'px'; s.style.top = (1180 + R() * 120) + 'px';
    stage.appendChild(s); setTimeout(() => s.remove(), 2700);
  }, i * 160);
}
// The gift card shows one gift at a time; a sent gift jumps straight to its own card.
let featI = 0, featT, menuGifts = [];
function buildMenu() {
  // Only gifts whose clip exists are shown, so the card never promises something she can't do yet.
  menuGifts = cfg.gifts.filter((g) => available.has(g.clip));
  $('feat').innerHTML = menuGifts.map((g, i) =>
    `<div class="gift" id="gift${i}"><div class="ic">${g.icon}</div><div><div class="g">${esc(g.gift)}</div><div class="a">${esc(g.action)}</div></div></div>`).join('');
  $('dots').innerHTML = menuGifts.map(() => '<i></i>').join('');
  // Long names shrink until they fit the card instead of running past its edge.
  requestAnimationFrame(() => document.querySelectorAll('.gift .g').forEach((el) => {
    let size = 36; while (el.scrollWidth > el.parentElement.clientWidth && size > 22) el.style.fontSize = (size -= 2) + 'px';
  }));
  showGift(0);
}
function showGift(i, hold = 4000) {
  if (!menuGifts.length) return;
  featI = (i + menuGifts.length) % menuGifts.length;
  menuGifts.forEach((_, k) => { $('gift' + k).classList.toggle('on', k === featI); $('dots').children[k].classList.toggle('on', k === featI); });
  clearTimeout(featT); featT = setTimeout(() => showGift(featI + 1), hold);
}
function hitRow(g) { const i = menuGifts.indexOf(g); if (i < 0) return; showGift(i, 7000); const el = $('gift' + i); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }

function render() {
  const pct = Math.min(100, Math.round(state.love / cfg.moodGoal * 100));
  $('loveBar').style.width = pct + '%'; $('loveNum').textContent = pct + '%';
  const top = Object.values(state.fans).sort((a, b) => b.coins - a.coins)[0];
  if (top) { $('favName').textContent = top.name; avatar($('favPic'), top.name, top.pic); }
  else { $('favName').textContent = 'could be you'; avatar($('favPic'), '♛', ''); }
}

function addLove(points) {
  state.love += points;
  if (state.love >= cfg.moodGoal) {
    state.love = 0;
    callout({ who: 'Affection full', what: 'Zuri adores you all tonight', big: true });
    sparkle(10);
    react('blink');
  }
  save(); render();
}

// ---------- events ----------
let lastLook = 0, lastJoinLook = 0, likesSinceBlink = 0, likesSinceRain = 0;
function handle(ev) {
  // Any viewer activity keeps her out of the leave-on modes. Once she's in one, only real attention
  // wakes her (gifts, pspsps, follows, a burst of likes); a single like, chat or join doesn't.
  if (!mode && ['gift', 'like', 'chat', 'follow', 'share'].includes(ev.type)) lastActivityAt = Date.now();
  if (mode && ev.type === 'follow') wakeUp();
  if (ev.type === 'status') { $('status').textContent = ev.text; return; }
  if (ev.type === 'reload') { location.reload(); return; }
  if (ev.type === 'config') { loadConfig().then(() => { buildMenu(); render(); if (!MONITOR) scheduleSurprise(); }); return; }
  if (MONITOR && ev.type === 'state') { mirrorState(ev.state); return; }
  if (MONITOR && ev.type === 'clipStarted') { mirrorClip(ev.clip, ev.at); return; }
  if (MONITOR && ['force', 'sleep', 'wake', 'surprise'].includes(ev.type)) return;
  if (ev.type === 'force') { react(ev.clip, { kind: 'force', onStart: () => toast(`<b>Control Room</b> played ${esc(ev.clip)}`) }); return; }
  if (ev.type === 'sleep') { lastActivityAt = Date.now() - ((cfg.modes?.sleep?.afterSeconds || 60) + 1) * 1000; replan(); return; }
  if (ev.type === 'wake') { wakeUp(); return; }
  if (ev.type === 'surprise') { fireSurprise(true); return; }
  if (ev.type === 'reset') { state = { love: 0, fans: {}, likesBank: 0 }; lastGiftAt = state.lastGiftAt = Date.now() - cfg.excitement.giftSeconds * 1000; save(); render(); return; }

  if (ev.type === 'gift') {
    // Seasonal gift names vary a little (spaces, capitals), so compare letters and digits only.
    const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9]/g, '');
    const g = cfg.gifts.find((x) => [x.gift, ...(x.aliases || [])].some((n) => norm(n) === norm(ev.gift)));
    const gift = g || cfg.defaultGift;
    const n = Math.max(1, ev.count || 1), coins = (ev.coins || gift.value || 1) * n;
    const who = ev.user.name;
    const wasDown = ['bored', 'sleepy', 'ignored'].includes(mood);
    lastGiftAt = state.lastGiftAt = Date.now();
    refreshMood();
    if (wasDown) toast(`<b>${esc(who)}</b> ${esc(cfg.cheerUpLine)}`);

    const key = ev.user.id || who;
    const prev = Object.values(state.fans).sort((a, b) => b.coins - a.coins)[0];
    const f = state.fans[key] || { name: who, pic: ev.user.pic, coins: 0 };
    f.coins += coins; f.name = who; f.pic = ev.user.pic || f.pic; state.fans[key] = f;
    const now = Object.values(state.fans).sort((a, b) => b.coins - a.coins)[0];
    if (prev && now.name !== prev.name) { $('fav').classList.remove('steal'); void $('fav').offsetWidth; $('fav').classList.add('steal'); toast(`<b>${esc(now.name)}</b> is her new favorite human`); }

    if (g) hitRow(g);
    // Real gifts carry TikTok's coin value; test gifts fall back to the gift's configured value.
    queueGift(gift, ev, n, Math.max(1, (ev.coins || gift.value || 1)) * n);
    sparkle(gift.big ? 10 : 4);
    addLove(coins);
  }

  if (ev.type === 'like') {
    const c = ev.count || 1;
    likeTimes.push({ t: Date.now(), n: c });
    state.likesBank += c;
    const pts = Math.floor(state.likesBank / cfg.likesPerMoodPoint);
    state.likesBank -= pts * cfg.likesPerMoodPoint;
    if (R() < 0.4) sparkle(1);
    // Every N taps she answers with a slow blink, so likes visibly do something.
    likesSinceBlink += c;
    if (likesSinceBlink >= cfg.likesForBlink) {
      likesSinceBlink = 0;
      if (!actionQ.length && !mode) react('blink', { onStart: () => toast(`<b>${cfg.likesForBlink} taps</b> · she slow-blinks back`) });
    }
    // Likes milestone: every N taps she goes to the window to watch the rain.
    likesSinceRain += c;
    if (cfg.likesForRainwatch && likesSinceRain >= cfg.likesForRainwatch) {
      likesSinceRain = 0;
      if (!mode) react('rainwatch', { onStart: () => callout({ who: `${cfg.likesForRainwatch} taps`, what: 'Zuri goes to watch the rain' }) });
    }
    if (pts) addLove(pts); else save();
    if (mode && likeTimes.reduce((t, x) => t + x.n, 0) >= cfg.excitement.likesToExcite) wakeUp();
  }

  if (ev.type === 'chat') {
    chatTimes.push({ t: Date.now(), n: 1 });
    const text = String(ev.text).trim().toLowerCase();
    const cmd = cfg.chatCommands[text] || (/^(ps){2,}$/.test(text) ? 'look' : null);
    if (cmd === 'look' && Date.now() - lastLook > cfg.lookCooldownSeconds * 1000 && !actionQ.length) {
      lastLook = Date.now();
      react('chat', { onStart: () => toast(`<b>${esc(ev.user.name)}</b> pspsps`) });
    }
  }
  if (ev.type === 'join') {
    toast(`<b>${esc(ev.user.name)}</b> entered the suite`);
    // Now and then she notices a newcomer and looks at the camera.
    if (Date.now() - lastJoinLook > cfg.joinLookCooldownSeconds * 1000 && !actionQ.length && !mode) { lastJoinLook = Date.now(); react('chat'); }
  }
  if (ev.type === 'follow') { toast(`<b>${esc(ev.user.name)}</b> now follows Zuri`); sparkle(5); }
  if (ev.type === 'share') toast(`<b>${esc(ev.user.name)}</b> shared her suite`);
}

// Monitor: follow the real overlay's clip and labels.
function mirrorClip(clip, at) {
  const v = cur; if (!clip) return;
  if (v.dataset.clip !== clip) { v.dataset.clip = clip; v.src = url(clip); }
  const go = () => { v.currentTime = Math.max(0, (Date.now() - at) / 1000); v.muted = true; v.play().catch(() => {}); };
  if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, { once: true });
}
let mirrored = '';
function mirrorState(st) {
  if (!st) return;
  if (st.clip && cur.dataset.clip !== st.clip) mirrorClip(st.clip, Date.now() - st.at * 1000);
  if (st.label && st.label + st.caption !== mirrored) {
    mirrored = st.label + st.caption; $('moodLabel').textContent = st.label;
    setFooter(st.caption);
  }
  $('loveBar').style.width = st.love + '%'; $('loveNum').textContent = st.love + '%';
  if (st.fav) { $('favName').textContent = st.fav.name; avatar($('favPic'), st.fav.name, st.fav.pic); }
}

let wsRef = null;
const report = (m) => { try { if (wsRef && wsRef.readyState === 1) wsRef.send(JSON.stringify(m)); } catch {} };
function connect() {
  const ws = wsRef = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', role: MONITOR ? 'monitor' : 'overlay', page: 'zuri', w: innerWidth, h: innerHeight, dpr: devicePixelRatio, ua: navigator.userAgent.split('Gecko) ').pop() }));
  ws.onmessage = (m) => handle(JSON.parse(m.data));
  ws.onclose = () => setTimeout(connect, 2000);
}
async function headOk(u) { try { return (await fetch(u, { method: 'HEAD' })).ok; } catch { return false; } }

// Clip lengths in seconds (from the server), for the countdowns.
let lens = {};
const clipLen = (c) => lens[c] || 8;
async function loadConfig() {
  try { lens = Object.fromEntries((await (await fetch('/api/clips')).json()).map((c) => [c.name, c.seconds])); } catch {}
  const next = await (await fetch('/config?name=' + (params.get('cfg') || 'zuri') + '&t=' + Date.now())).json();
  const modeClips = Object.values(next.modes || {}).flatMap((m) => [m.enter, m.loop, m.exit]);
  const names = [...Object.values(next.variants || {}).flat(), ...Object.keys(next.moments), ...next.gifts.map((g) => g.clip), ...modeClips, ...Object.keys(next.surprises?.pool || {}),
    'rainwatch', next.fallbackClip, next.defaultGift.clip];
  cfg = next;
  const found = new Set();
  await Promise.all([...new Set(names)].map(async (n) => (await headOk(url(n))) && found.add(n)));
  available.clear(); found.forEach((n) => available.add(n));
  if (music) fadeTo(music, mode && cfg.modes[mode]?.quietMusic ? cfg.audio.quietMusicVolume : cfg.audio.musicVolume, 800);
}

async function init() {
  await loadConfig();
  $('poster').src = cfg.poster;
  buildMenu();
  // ?preview=<mood> shows that mood plus a sample callout and toast, for design review.
  if (params.get('preview')) {
    lastGiftAt = Date.now() - ((cfg.moods[params.get('preview')]?.afterSeconds ?? 0) + 1) * 1000;
    setTimeout(() => callout({ who: 'maria_23', what: 'offered Zuri a rose', big: params.has('big') }), 300);
    setTimeout(() => toast('<b>leo.k</b> entered the suite'), 300);
  }
  if (!params.get('preview')) lastGiftAt = state.lastGiftAt || Date.now() - cfg.excitement.giftSeconds * 1000;
  render();
  connect();
  if (MONITOR) return;
  await setupAudio();
  startPlayer();
  scheduleSurprise();
}
init();
</script>
</body>
